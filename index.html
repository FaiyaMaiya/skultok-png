<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkulTok - AI Tutor bilong PNG with Voice</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f0fdf4;margin:0;padding:0;min-width:0}
.header{background:#15803d;color:white;padding:20px 16px;text-align:center}
.header h1{margin:0 0 8px;font-size:clamp(1.5rem,4vw,2rem)}
.header p{margin:0}
.container{width:min(850px,calc(100% - 32px));margin:20px auto;background:white;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1);overflow:hidden}
.controls{display:flex;gap:8px;padding:12px;background:#dcfce7;flex-wrap:wrap}
select,button{padding:10px;border-radius:8px;border:1px solid #ccc}
.controls select{flex:1 1 180px;min-width:0}
.controls label{display:inline-flex;align-items:center;gap:5px;padding:0 4px}
.controls select,.controls button{cursor:pointer}
.controls label,.controls input[type="checkbox"]{cursor:pointer}
.chat{height:clamp(300px,55vh,520px);overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.msg{padding:10px 14px;border-radius:12px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.user{align-self:flex-end;background:#15803d;color:white}
.bot{align-self:flex-start;background:#e5e7eb}
.input{display:flex;flex-direction:column;padding:12px;border-top:1px solid #eee;gap:8px}
.input-controls{display:flex;align-items:center;gap:8px;width:100%}
.input input{flex:1;min-width:0;width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;font:inherit;font-size:16px}
.audio-visualizer{display:none;align-items:center;gap:10px;padding:8px 12px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;color:#166534;font-size:13px}
.audio-visualizer.active{display:flex}
.audio-visualizer canvas{display:block;width:100%;height:42px;min-width:0}
.audio-visualizer-label{flex:none;font-weight:600}
.icon-btn{font-size:18px;background:#fff;cursor:pointer;min-width:44px}
.record-btn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;width:44px;height:44px;padding:10px;border:1px solid #15803d;border-radius:50%;background:#15803d;color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .15s ease}
.record-btn:hover{background:#166534;border-color:#166534}
.record-btn:active{transform:scale(.98)}
.record-btn:focus-visible{outline:3px solid #86efac;outline-offset:2px}
.record-btn svg{width:18px;height:18px;flex:none}
.record-btn .stop-icon{display:none}
.record-btn.recording{background:#b91c1c;border-color:#b91c1c;animation:none}
.record-btn.recording:hover{background:#991b1b;border-color:#991b1b}
.record-btn.recording .mic-icon{display:none}
.record-btn.recording .stop-icon{display:block}
.send{background:#15803d;color:white;border:none}
.speak-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:#fef3c7;border:none;cursor:pointer;margin-top:6px;border-radius:6px;padding:6px 9px;color:#713f12}
.speak-btn svg{width:16px;height:16px;flex:none}
.speaker-icon{width:24px;height:24px;vertical-align:middle}
.inline-mic-icon{width:16px;height:16px;vertical-align:-3px;margin:0 2px;color:#15803d}
.footer{text-align:center;padding:10px;font-size:12px;color:#666}
@media(max-width:600px){
 .header{padding:16px 12px}
 .header p{font-size:14px;line-height:1.4}
 .container{width:100%;margin:0;border-radius:0;box-shadow:none}
 .controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}
 .controls select,.controls button{width:100%;min-height:44px}
 .controls label{min-height:44px}
 .chat{height:clamp(240px,48dvh,440px);padding:12px}
 .msg{max-width:92%}
 .input{padding:10px;gap:8px}
 .input-controls{gap:6px}
 .input input{padding:11px 10px}
 .footer{line-height:1.4;padding:10px 14px}
}
@media(max-width:380px){
 .controls{gap:6px;padding:8px}
 .controls select,.controls button{padding:8px;font-size:14px}
 .chat{padding:10px}
 .input-controls{gap:5px}
 .record-btn,.icon-btn{min-width:40px;width:40px;height:40px;padding:8px}
 .record-btn svg{width:17px;height:17px}
}
@media(min-width:601px) and (max-width:800px){
 .container{width:calc(100% - 40px)}
 .chat{height:clamp(320px,52vh,460px)}
}
</style>
</head>
<body>
<div class="header">
<h1>SkulTok 🇵🇬 <svg class="speaker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Audio"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg></h1>
<p>Bilingual Voice Tutor - Tok Pisin + English | From Papua New Guinea</p>
</div>
<div class="container">
<div class="controls">
<select id="grade"><option>Grade 5</option><option>Grade 6</option><option>Grade 7</option><option selected>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select>
<select id="lang"><option>English + Tok Pisin</option><option>English Only</option><option>Tok Pisin Only</option></select>
<label><input type="checkbox" id="autoSpeak" checked> Auto Speak</label>
<button onclick="clearChat()" title="Clear the conversation">Clear</button>
</div>
<div id="chat" class="chat">
<div class="msg bot">Gude! Mi SkulTok. Press mic <svg class="inline-mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"></path></svg> na toktok, o raitim kwestin. / Press mic to speak or type your question!
<button class="speak-btn" onclick="speakText(this)" aria-label="Listen to greeting" title="Play the greeting aloud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg><span>Harim / Listen</span></button>
</div>
</div>
<div class="input">
<div id="audioVisualizer" class="audio-visualizer" aria-live="polite">
<span class="audio-visualizer-label">Listening</span>
<canvas id="audioSpectrum" role="img" aria-label="Live microphone audio spectrum"></canvas>
</div>
<div class="input-controls">
<button id="mic" class="record-btn" onclick="toggleMic()" aria-label="Start voice recording" aria-pressed="false" title="Start voice recording">
<svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"></path></svg>
<svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
</button>
<input id="q" placeholder="Askim kwestin or press mic..." onkeypress="if(event.key==='Enter')ask()">
<button class="icon-btn send" onclick="ask()" aria-label="Send message" title="Send your message">➤</button>
<button class="icon-btn" onclick="stopSpeaking()" aria-label="Stop audio playback" title="Stop audio playback"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="m22 9-6 6m0-6 6 6"></path></svg></button>
</div>
</div>
</div>
<div class="footer">Built in Papua New Guinea for AI Builder Cup 2026 | Voice: Web Speech API + Gemini</div>
<script>
let recognition;
let isRecording=false;
let lastReply="";
let recognizedTranscript="";
let audioStream;
let audioContext;
let analyser;
let spectrumFrame;

// Check speech support
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognition){
 recognition = new SpeechRecognition();
 recognition.continuous=false;
 recognition.interimResults=false;
 recognition.lang='en-PG'; // works for Tok Pisin mix too
 recognition.onstart=()=>{isRecording=true;recognizedTranscript="";setRecordingButton(true);}
 recognition.onend=()=>{
  isRecording=false;
  setRecordingButton(false);
  stopAudioVisualizer();
  if(recognizedTranscript.trim()){
   document.getElementById('q').value=recognizedTranscript.trim();
   recognizedTranscript="";
   ask();
  }
 }
 recognition.onresult=(e)=>{
   recognizedTranscript=Array.from(e.results).map(result=>result[0].transcript).join(' ').trim();
   document.getElementById('q').value=recognizedTranscript;
 }
 recognition.onerror=(e)=>{recognizedTranscript="";alert('Mic error: '+e.error+' - allow microphone in browser');isRecording=false;setRecordingButton(false);stopAudioVisualizer();}
}

function setRecordingButton(recording){
 const mic=document.getElementById('mic');
 mic.classList.toggle('recording',recording);
 mic.setAttribute('aria-pressed',String(recording));
 mic.setAttribute('aria-label',recording?'Stop voice recording':'Start voice recording');
 mic.title=recording?'Stop voice recording':'Start voice recording';
}

async function startAudioVisualizer(){
 const visualizer=document.getElementById('audioVisualizer');
 const canvas=document.getElementById('audioSpectrum');
 if(!navigator.mediaDevices?.getUserMedia || !window.AudioContext){return;}

 try{
  audioStream=await navigator.mediaDevices.getUserMedia({audio:true});
  audioContext=new AudioContext();
  const source=audioContext.createMediaStreamSource(audioStream);
  analyser=audioContext.createAnalyser();
  analyser.fftSize=128;
  analyser.smoothingTimeConstant=0.75;
  source.connect(analyser);
  visualizer.classList.add('active');

  const canvasContext=canvas.getContext('2d');
  const frequencyData=new Uint8Array(analyser.frequencyBinCount);
  const drawSpectrum=()=>{
   if(!analyser || !canvasContext){return;}
   const pixelRatio=window.devicePixelRatio||1;
   const width=canvas.clientWidth;
   const height=canvas.clientHeight;
   if(canvas.width!==Math.round(width*pixelRatio)||canvas.height!==Math.round(height*pixelRatio)){
    canvas.width=Math.round(width*pixelRatio);
    canvas.height=Math.round(height*pixelRatio);
   }
   canvasContext.setTransform(pixelRatio,0,0,pixelRatio,0,0);
   canvasContext.clearRect(0,0,width,height);
   analyser.getByteFrequencyData(frequencyData);
   const barCount=36;
   const gap=3;
   const barWidth=Math.max(2,(width-gap*(barCount-1))/barCount);
   for(let index=0;index<barCount;index++){
    const value=frequencyData[Math.floor(index*frequencyData.length/barCount)]/255;
    const barHeight=Math.max(3,value*(height-4));
    const x=index*(barWidth+gap);
    const y=(height-barHeight)/2;
    canvasContext.fillStyle=`hsl(${142-value*28} 70% ${38+value*12}%)`;
    canvasContext.beginPath();
    canvasContext.roundRect(x,y,barWidth,barHeight,barWidth/2);
    canvasContext.fill();
   }
   spectrumFrame=requestAnimationFrame(drawSpectrum);
  };
  drawSpectrum();
 }catch(error){
  console.warn('Microphone spectrum is unavailable:',error);
  visualizer.classList.remove('active');
  stopAudioVisualizer();
 }
}

function stopAudioVisualizer(){
 if(spectrumFrame){cancelAnimationFrame(spectrumFrame);spectrumFrame=null;}
 if(audioStream){audioStream.getTracks().forEach(track=>track.stop());audioStream=null;}
 analyser=null;
 if(audioContext){audioContext.close().catch(()=>{});audioContext=null;}
 document.getElementById('audioVisualizer').classList.remove('active');
}

async function toggleMic(){
 if(!recognition){alert('Your browser no support mic. Use Chrome on Android.');return;}
 if(isRecording){recognition.stop();stopAudioVisualizer();}
 else{
  await startAudioVisualizer();
  try{recognition.start();}
  catch(error){stopAudioVisualizer();console.error('Could not start voice recording:',error);}
 }
}

function speakText(btnOrText){
 let text = typeof btnOrText === 'string'? btnOrText : btnOrText.parentElement.innerText.replace('Harim / Listen','');
 if('speechSynthesis' in window){
   window.speechSynthesis.cancel();
   let utter = new SpeechSynthesisUtterance(text);
   utter.lang = document.getElementById('lang').value.includes('Tok Pisin')? 'en-PG' : 'en-US';
   utter.rate=0.9;
   window.speechSynthesis.speak(utter);
   lastReply=text;
 }
}
function stopSpeaking(){window.speechSynthesis.cancel();}

function appendMessage(text, role, speakable=false){
 const chat=document.getElementById('chat');
 const message=document.createElement('div');
 message.className=`msg ${role}`;
 message.textContent=text;

 if(speakable){
  const button=document.createElement('button');
  button.className='speak-btn';
  button.type='button';
  button.setAttribute('aria-label','Listen to response');
  button.title='Play this response aloud';
  button.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg><span>Harim / Listen</span>';
  button.addEventListener('click',()=>speakText(text));
  message.append(document.createElement('br'),button);
 }

 chat.appendChild(message);
 chat.scrollTop=chat.scrollHeight;
}

async function ask(){
 let input=document.getElementById('q');
 let msg=input.value.trim(); if(!msg)return;
 appendMessage(msg,'user');
 input.value='';
 let grade=document.getElementById('grade').value;
 let lang=document.getElementById('lang').value;
 try{
  let res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,grade,lang})});
  let data=await res.json();
  if(!res.ok){throw new Error(data.error||'Chat request failed');}
  appendMessage(data.reply||'No response received. Please try again.','bot',true);
  if(document.getElementById('autoSpeak').checked){speakText(data.reply);}
 }catch(e){appendMessage('Sori, connection bagarap. Try gen.','bot');}
}
function clearChat(){stopSpeaking();document.getElementById('chat').innerHTML='<div class="msg bot">Chat cleared. Press <svg class="inline-mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"></path></svg> na toktok!</div>';}
</script>
</body>
</html>
